[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs", "hatchling>=1.27"]

[project]
authors = [{email = "eric.wieske@gmail.com", name = "Roy Eric Wieske"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Topic :: Software Development",
]
dependencies = [
  "matplotlib",
  "meegkit",
  "mne-bids>=0.18",
  "mne-denoise>=0.0.2",  # ZapLine's n_select and adaptive mode
  "mne-faster",
  "mne-icalabel>=0.8",
  "mne>=1.13",
  "nibabel",  # not imported directly: MNE reads fsaverage MRIs with it (plots)
  "numpy",
  "onnxruntime",
  "Pillow",
  "pybv",  # not imported directly: MNE exports BrainVision (BIDS) with it
  "pyprep>=0.8",
  "python-picard",
  "pyxdf",
  "scikit-learn",  # not imported directly: MNE's ICA (fastica) and covariances
  "scipy",
]
description = "MoBI data loading, preprocessing, and visualization built on MNE-Python"
dynamic = ["version"]
keywords = [
  "eeg",
  "eye-tracking",
  "neuroscience",
  "data analysis",
]
license = "BSD-3-Clause"
license-files = ["LICENSE"]
maintainers = [
  {email = "eric.wieske@gmail.com", name = "Roy Eric Wieske"},
]
name = "pybemobil"
readme = {content-type = "text/markdown", file = "README.md"}
requires-python = ">=3.11"

[project.optional-dependencies]
# Dependencies for developer installations
dev = ["build", "pybemobil[test]", "ipykernel", "ipython", "pre-commit", "ruff", "twine"]
# Dependencies for building the documentation
docs = [
    "sphinx>=7",
    "pydata-sphinx-theme>=0.15",
    "numpydoc",
    "sphinx-copybutton",
]
# JAX-accelerated AMICA implementation used by compute_ica(ica_method="jamica")
# (the default).  Optional: compute_ica falls back to picard with a warning
# when this is not installed.
jamica = ["jamica[jax]>=0.3"]
# Nicer ICLabel probability plots in the HTML report (falls back to
# matplotlib without it)
report = ["seaborn"]
# Dependencies for running the test infrastructure
test = ["pybemobil[jamica,report]", "pytest", "pytest-cov", "pytest-sugar", "pytest-xdist"]

[project.urls]
"Bug Tracker" = "https://github.com/BeMoBIL/pybemobil/issues/"
"Documentation" = "https://bemobil.github.io/pybemobil/"
"Source Code" = "https://github.com/BeMoBIL/pybemobil/"

[tool.hatch.build]
exclude = [
  "/.*",
]

[tool.hatch.build.targets.sdist]
# The sdist carries the tests so that downstream packagers can run them.
include = ["/pybemobil", "/tests", "/doc", "/CITATION.cff", "/README.md", "/LICENSE"]

[tool.hatch.build.targets.wheel]
packages = ["pybemobil"]

[tool.hatch.metadata]
allow-direct-references = true  # allow specifying URLs in our dependencies

[tool.hatch.version]
# no-local-version: dev builds (e.g. for TestPyPI) get versions like
# 0.1.dev3 instead of 0.1.dev3+g1234abc, which PyPI would reject
raw-options = {local_scheme = "no-local-version", version_scheme = "release-branch-semver"}
source = "vcs"

[tool.pytest.ini_options]
addopts = """--cov=pybemobil --cov-report=html --cov-config=pyproject.toml
    --durations=20 -ra --junit-xml=junit-results.xml --tb=short
    --ignore=doc -n auto"""
filterwarnings = [
  "ignore::DeprecationWarning:mne",
]
testpaths = ["tests"]

[tool.coverage.run]
omit = ["*tests*", "pybemobil/examples/*"]
source = ["pybemobil"]
# Required for pytest-xdist: each worker writes its own .coverage.* file
# which coverage combine merges at the end.
parallel = true

[tool.coverage.report]
exclude_lines = ["if 0:", "if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
# Markdown code blocks are hand-formatted documentation
extend-exclude = ["*.md"]

[tool.ruff.lint]
exclude = ["__init__.py"]
select = ["A", "D", "E", "F", "I", "UP", "W"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.tomlsort]
all = true
ignore_case = true
spaces_before_inline_comment = 2
trailing_comma_inline_array = true
